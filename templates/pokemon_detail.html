<!-- Pokemon detail template: used by GET /pokemon/:id and HTMX swaps -->
<div class="poke-card bg-poke-dark/70 backdrop-blur rounded-2xl border border-white/5 overflow-hidden">
  <!-- Image -->
  <div class="relative h-48 bg-gradient-to-br from-poke-dark to-poke-blue flex items-center justify-center overflow-hidden">
    {{if .ImageURL}}
      <img src="{{.ImageURL}}" alt="{{.Name}}" 
           class="absolute inset-0 w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity duration-300">
    {{else}}
      <div class="text-7xl opacity-30">🔴</div>
    {{end}}
    <div class="absolute top-3 right-3">
      <span class="type-badge px-2 py-1 rounded-full bg-poke-red/90 text-white">
        {{.Type1}}
      </span>
      {{if .Type2}}
        <span class="type-badge px-2 py-1 rounded-full bg-poke-accent/90 text-white ml-1">
          {{.Type2}}
        </span>
      {{end}}
    </div>
    <div class="absolute bottom-3 left-3">
      <span class="text-xs text-gray-400 bg-poke-dark/80 px-2 py-1 rounded">
        No.{{.ID}}
      </span>
    </div>
  </div>

  <!-- Body -->
  <div class="p-5">
    <h2 class="text-xl font-bold text-white mb-3">{{.Name}}</h2>

    <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
      <div class="bg-white/5 rounded-lg p-3">
        <p class="text-gray-400 text-xs mb-1">Height</p>
        <p class="text-white font-medium">{{.Height}}</p>
      </div>
      <div class="bg-white/5 rounded-lg p-3">
        <p class="text-gray-400 text-xs mb-1">Weight</p>
        <p class="text-white font-medium">{{.Weight}}</p>
      </div>
      <div class="bg-white/5 rounded-lg p-3">
        <p class="text-gray-400 text-xs mb-1">Base Exp</p>
        <p class="text-white font-medium">{{.BaseExperience}}</p>
      </div>
      <div class="bg-white/5 rounded-lg p-3">
        <p class="text-gray-400 text-xs mb-1">Evolves From</p>
        <p class="text-white font-medium">{{.EvolvesFromStatus}}</p>
      </div>
    </div>

    <p class="text-gray-300 text-sm mb-4 line-clamp-3">{{.Description}}</p>

    <div class="flex gap-2 mt-4">
      <a href="/pokemon/{{.ID}}/edit" 
         class="flex-1 bg-poke-blue hover:bg-poke-blue/90 text-white text-sm font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        Edit
      </a>
      <button 
        class="flex-1 bg-poke-red hover:bg-poke-red/90 text-white text-sm font-medium py-2 px-4 rounded-lg transition flex items-center justify-center gap-1"
        hx-delete="/pokemon/{{.ID}}" 
        hx-confirm="Delete {{.Name}}? This cannot be undone."
        hx-target="closest div"
        hx-swap="outerHTML"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        Delete
      </button>
    </div>
  </div>
</div>
